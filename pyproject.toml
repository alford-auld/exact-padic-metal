[project]
name = "padic-character-nn"
version = "0.1.0"
description = "Algorithm 6 of arXiv:2603.29905 (2-adic character neural networks) on exact subset-lattice transforms"
requires-python = ">=3.12"
dependencies = [
    "mlx==0.32.2",
    "numpy==2.5.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["padic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running"]
